name: Publish to CurseForge, Modrinth & GitHub

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  MINECRAFT_VERSION: 1.7.10
  JAVA_VERSION: '8'
  # Update this version when triggering via workflow_dispatch without a git tag
  VERSION: 1.0.0
  MOD_NAME: UNM

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Mod with Gradle
        run: ./gradlew clean build --info

      - name: Publish (CurseForge / Modrinth / GitHub)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # CurseForge
          curseforge-id: 1799180
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          # Modrinth
          modrinth-id: 7WXZFGKU
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # GitHub Release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', env.VERSION) }}

          # Release Details
          name: "${{ env.MOD_NAME }} ${{ github.ref_type == 'tag' && github.ref_name || env.VERSION }} [1.7.10]"
          version: "${{ github.ref_type == 'tag' && github.ref_name || env.VERSION }}"
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: forge
          game-versions: "${{ env.MINECRAFT_VERSION }}"
          java: Java 8

          # Targets the reobfuscated jar and ignores Forge's '-dev' or '-sources' jars
          files: |
            build/libs/!(*-dev|*-sources).jar
